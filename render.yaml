services:
  - type: web
    name: voice-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # --- Required secrets — set these in the Render dashboard ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: VAPI_SERVER_CREDENTIAL_ID
        sync: false
      - key: LLM_SECRET_TOKEN
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: VAPI_VOICE_ID
        sync: false
      # --- Supabase Postgres — set DATABASE_URL in the Render dashboard ---
      - key: DATABASE_URL
        sync: false
      # --- Service URL (needed for outbound Vapi dials) ---
      - key: WEBHOOK_URL
        value: https://voice-agent-ede2.onrender.com
      # --- Frontend URL for CORS (set after frontend first deploys) ---
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: voice-agent-frontend
    runtime: static
    staticPublishPath: ./dist
    rootDir: frontend
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_URL
        value: https://voice-agent-ede2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
